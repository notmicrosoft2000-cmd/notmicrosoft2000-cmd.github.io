<!DOCTYPE html>
<html lang="en" data-theme="webring">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Neptune Productions — the webring. The Question Game, The Simpler Times, Normidian, NeptuneDOS, NeptuneOS, DropChat, SlowFuck Pro, Bakugo's Location. Pick a thing. The whole site becomes it.">
  <meta name="theme-color" content="#8a2b2b">
  <title>NEPTUNE PRODUCTIONS — HUB</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("hub_theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("hub_rm") === "on") document.documentElement.classList.add("rm");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bgfx" aria-hidden="true"></div>

  <header class="top">
    <button class="brand" id="brandBtn" type="button" aria-label="NEPTUNE PRODUCTIONS">
      <span class="brand-mark" id="brandMark" title="go home">NP</span>
      <span class="brand-text" id="brandText" title="open settings">
        <span class="brand-name">NEPTUNE PRODUCTIONS</span>
        <span class="brand-tag">click the wordmark for settings</span>
      </span>
    </button>
    <div class="top-actions">
      <button class="home-btn" id="homeBtn" type="button" aria-label="go home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11 L12 3 L21 11"/>
          <path d="M5 10 v10 h5 v-6 h4 v6 h5 V10"/>
        </svg>
      </button>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18 M3 12h18 M3 18h12"/>
        </svg>
        <span>MENU</span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="foot">
    <p>NEPTUNE PRODUCTIONS — est. 1987 (allegedly). every program is a different corner of the same hallway.</p>
    <p class="foot-gh"><a href="https://github.com/notmicrosoft2000-cmd" target="_blank" rel="noopener">GITHUB ↗</a></p>
  </footer>

  <div class="rail-wrap" id="railWrap">
    <div class="rail-zone" aria-hidden="true"></div>
    <aside class="rail" id="rail" aria-label="webring switcher">
      <p class="rail-title">THE WEBRING</p>
      <nav class="rail-list" id="railList"></nav>
    </aside>
  </div>
  <button class="rail-tab" id="railTab" type="button" aria-label="open webring switcher">
    <span></span><span></span><span></span>
  </button>

  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <div class="menu-panel">
      <button class="ov-close" id="menuClose" type="button">CLOSE</button>
      <ul class="menu-list" id="menuList"></ul>
    </div>
  </div>

  <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
    <div class="settings-panel">
      <div class="settings-head">
        <h2>SETTINGS</h2>
        <button class="ov-close" id="settingsClose" type="button">CLOSE</button>
      </div>
      <div class="settings-body" id="settingsBody"></div>
    </div>
  </div>

  <div class="swap" id="swap" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="swap-piece" id="swapPiece"></div>
    <h2 class="swap-title" id="swapTitle"></h2>
    <div class="swap-progress" id="swapProgress"><span></span></div>
    <span class="swap-skip">ESC TO CANCEL</span>
  </div>

  <div class="cur-ring" id="curRing" aria-hidden="true"></div>

  <script src="js/hub.js"></script>
</body>
</html>
