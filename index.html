<!DOCTYPE html>
<html lang="en" data-theme="webring">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Neptune Productions Inc — a publicly traded company, allegedly. The Question Game, The Simpler Times, Normidian, NeptuneDOS, NeptuneOS, DropChat, SlowFuck Pro, Bakugo's Location. Symbol: NEPT. Disenfranchisement: ongoing.">
  <meta name="theme-color" content="#8a2b2b">
  <title>NEPTUNE PRODUCTIONS INC — HUB</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("hub_theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("hub_rm") === "on") document.documentElement.classList.add("rm");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas class="bg-particles" id="bgParticles" aria-hidden="true"></canvas>
  <div class="bgfx" aria-hidden="true"></div>

  <header class="top">
    <button class="brand" id="brandBtn" type="button" aria-label="open settings">
      <span class="brand-mark" id="brandMark" title="open settings">NP</span>
      <span class="brand-text">
        <span class="brand-name">NEPTUNE PRODUCTIONS</span>
      </span>
    </button>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="foot">
    <p>NEPTUNE PRODUCTIONS</p>
    <p class="foot-gh"><a href="https://github.com/notmicrosoft2000-cmd" target="_blank" rel="noopener">GITHUB</a></p>
  </footer>

  <div class="rail-wrap" id="railWrap">
    <div class="rail-zone" aria-hidden="true"></div>
    <button class="rail-tab" id="railTab" type="button" aria-label="navigate the webring">
      <span></span><span></span><span></span>
    </button>
    <aside class="rail" id="rail" aria-label="webring switcher">
      <div class="rail-head">
        <p class="rail-title">NAVIGATE — THE WEBRING</p>
        <button class="r-collapse" id="railCollapse" type="button" aria-label="collapse the webring">&laquo;</button>
      </div>
      <nav class="rail-list" id="railList"></nav>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-hidden="true">
    <div class="toast-head">
      <b id="toastTitle">WELCOME TO THE HALLWAY</b>
      <button class="toast-x" id="toastX" type="button" aria-label="dismiss">CLOSE</button>
    </div>
    <p id="toastBody"></p>
  </div>

  <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
    <div class="settings-panel">
      <div class="settings-head">
        <h2>SETTINGS</h2>
        <button class="ov-close" id="settingsClose" type="button">CLOSE</button>
      </div>
      <div class="settings-body" id="settingsBody"></div>
    </div>
  </div>

  <div class="swap" id="swap" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="swap-piece" id="swapPiece"></div>
    <h2 class="swap-title" id="swapTitle"></h2>
    <div class="swap-progress" id="swapProgress"><span></span></div>
    <span class="swap-skip">ESC TO CANCEL</span>
  </div>

  <button class="scroll-top" id="scrollTop" type="button" aria-label="scroll to top">&uarr;</button>

  <div class="cur-ring" id="curRing" aria-hidden="true"></div>

  <div class="notify-overlay" id="notifyOverlay" aria-hidden="true">
    <div class="notify-box">
      <h2>NAVIGATION LIVES HERE</h2>
      <div class="notify-arrow" aria-hidden="true"></div>
      <p>Move your cursor to the <b>left edge</b> of the screen to reveal the webring rail. That is how you hop between programs.</p>
      <p class="notify-settings-hint">Click the <b>logo, top-left</b> for settings.</p>
      <button class="notify-dismiss" id="notifyDismiss" type="button">GOT IT</button>
    </div>
  </div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js" defer></script>
  <script src="js/hub.js"></script>
</body>
</html>
